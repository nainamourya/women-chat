<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#32194a" />
  <title>You're offline — GiiGirl</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #fff5fa; color: #32194a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 16px 0 6px; }
    p { margin: 0 0 20px; color: #6b5878; max-width: 20rem; }
    button { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: .95rem;
      color: #fff; background: linear-gradient(135deg, #32194a 0%, #d93691 100%); cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { background: #17111f; color: #f5e9f7; } p { color: #b9a6c4; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>GiiGirl needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
