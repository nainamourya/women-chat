name: Keep Render backend awake

# Render's free tier puts a web service to sleep after ~15 minutes with no
# incoming requests, causing a slow cold-start on the next real request.
# The backend can't prevent this itself — once asleep, no code is running
# inside it to ping anything — so this hits its health endpoint from the
# outside, on a schedule well within that 15-minute window. GitHub doesn't
# guarantee exact cron timing (runs can slip by a few minutes under load),
# but that's comfortably within tolerance here.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # A cold Render instance can take longer than 20s to answer the first
      # request after waking up, which was failing this step outright. 60s
      # plus one retry gives a sleeping instance a real chance to wake and
      # respond before this is treated as a genuine outage.
      - name: Ping health endpoint
        run: |
          curl -fsS --connect-timeout 10 --max-time 60 --retry 1 --retry-delay 5 \
            https://jingirl-backend.onrender.com/api/health
